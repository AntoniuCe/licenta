# IMPORTANT: Change all values marked <-- before applying.
# Never commit real secrets to git. Use sealed-secrets or Vault in production.
# For this project, keep this file out of your repo (.gitignore it).

# ── Postgres credentials (used by CNPG initdb) ────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: ecommerce
type: kubernetes.io/basic-auth
stringData:
  username: "postgres"
  password: "postgres"   

---
# ── Backend environment variables ─────────────────────────────────────────
# These map directly to what your database.go reads from os.Getenv()
apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
  namespace: ecommerce
type: Opaque
stringData:
  # DB — points to the CNPG primary service (auto-updated on failover)
  DB_HOST: "ecommerce-pg-rw.ecommerce.svc.cluster.local"
  DB_PORT: "5432"
  DB_USER: "postgres"
  DB_PASSWORD: "postgres" 
  DB_NAME: "ecommerce"

  # JWT — your config.go reads JWT_SECRET from env
  JWT_SECRET: ""   

  # SMTP — leave empty to silently skip confirmation emails (your email.go handles this)
  SMTP_HOST: ""
  SMTP_PORT: ""
  SMTP_USER: ""
  SMTP_PASS: ""
  SMTP_FROM: ""

  VITE_GOOGLE_CLIENT_ID: ""
