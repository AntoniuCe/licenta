# Dedicated application role — NOT the postgres superuser.
# CNPG can declaratively manage this role's password (unlike "postgres",
# which is reserved for operator use and must be changed manually).
apiVersion: v1
kind: Secret
metadata:
  name: ecommerce-app-credentials
  namespace: ecommerce
type: kubernetes.io/basic-auth
stringData:
  username: ecommerce_app
  password: "postgres"   # <-- CHANGE THIS to a real strong password